<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9;">
    <div style="max-width: 600px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
        <h1 style="text-align: center; color: #333;">My Profile</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="profile-picture.jpg" alt="Profile Picture" style="width: 150px; height: 150px; border-radius: 50%; border: 2px solid #ddd;">
        </div>
        <p style="font-size: 16px; color: #555; line-height: 1.6;">
            <strong>Name:</strong> John Doe<br>
            <strong>Email:</strong> john.doe@example.com<br>
            <strong>Phone:</strong> +1 234 567 890<br>
            <strong>Address:</strong> 123 Main Street, City, Country
        </p>
        <div style="text-align: center; margin-top: 20px;">
            <button style="padding: 10px 20px; font-size: 16px; color: #fff; background-color: #007bff; border: none; border-radius: 4px; cursor: pointer;">
                Edit Profile
            </button>
        </div>
    </div>
</body>
</html>
